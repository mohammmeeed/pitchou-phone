<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#38bdf8" opacity="0.14"/>
  <!-- Powerbank block -->
  <g transform="translate(135, 80)">
    <rect width="130" height="200" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Top Port panel -->
    <rect x="25" y="15" width="22" height="8" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect x="55" y="15" width="20" height="8" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <rect x="83" y="15" width="22" height="8" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <!-- Digital LED display -->
    <rect x="35" y="45" width="60" height="35" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <text x="65" y="69" font-family="monospace" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">100%</text>
    <!-- Lightning fast charge -->
    <polygon points="68,110 54,145 64,145 60,170 78,135 68,135" fill="url(#pbGrad)"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">POWERBANKS</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">BATTERIES EXTERNES RAPIDES</text>
</svg>