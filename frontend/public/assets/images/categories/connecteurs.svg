<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#10b981" opacity="0.14"/>
  <g transform="translate(130, 95)">
    <!-- Flex board -->
    <rect x="10" y="30" width="120" height="110" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <!-- Type-C metal socket on board -->
    <rect x="42" y="15" width="56" height="30" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="52" y="24" width="36" height="12" rx="4" fill="#0f172a"/>
    <!-- Microphone hole & IC chip -->
    <circle cx="28" cy="85" r="5" fill="#facc15"/>
    <rect x="80" y="70" width="32" height="32" rx="4" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">CONNECTEURS DE CHARGE</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">NAPPE DE CHARGE TYPE-C &amp; MICRO</text>
</svg>
