<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#38bdf8" opacity="0.12"/>
  <!-- Desk/Car mount with phone -->
  <g transform="translate(140, 80)">
    <!-- Base stand -->
    <ellipse cx="60" cy="205" rx="45" ry="12" fill="#334155"/>
    <path d="M 52 205 L 56 120 L 64 120 L 68 205 Z" fill="#475569"/>
    <!-- Clamp/Holder -->
    <rect x="25" y="100" width="70" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Mounted Phone angled -->
    <rect x="15" y="45" width="90" height="150" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
    <rect x="22" y="52" width="76" height="136" rx="10" fill="#0284c7" opacity="0.3"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">SUPPORTS VOITURE &amp; BUREAU</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">MAGNÉTIQUE, GRILLE &amp; TRÉPIED</text>
</svg>
