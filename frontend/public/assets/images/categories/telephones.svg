<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#209f84"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="110" fill="#209f84" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Back Phone -->
  <g transform="translate(140, 75) rotate(-12)">
    <rect width="110" height="210" rx="22" fill="#334155" stroke="#475569" stroke-width="3"/>
    <rect x="7" y="7" width="96" height="196" rx="16" fill="#1e293b"/>
  </g>

  <!-- Front Main Phone -->
  <g transform="translate(145, 85)">
    <!-- Phone Body -->
    <rect width="118" height="226" rx="24" fill="#0f172a" stroke="url(#phoneGrad)" stroke-width="4"/>
    <!-- Screen -->
    <rect x="6" y="6" width="106" height="214" rx="19" fill="url(#screenGrad)"/>
    <!-- Dynamic Island / Camera Notch -->
    <rect x="44" y="14" width="30" height="8" rx="4" fill="#000000"/>
    <circle cx="68" cy="18" r="2" fill="#1e293b"/>
    <!-- Screen Wallpaper Graphics -->
    <circle cx="59" cy="115" r="38" fill="url(#phoneGrad)" opacity="0.85"/>
    <path d="M 12 170 C 35 140, 75 190, 106 150 L 106 214 L 6 214 Z" fill="url(#phoneGrad)" opacity="0.4"/>
    <!-- Home Bar -->
    <rect x="41" y="210" width="36" height="3" rx="1.5" fill="#ffffff" opacity="0.6"/>
  </g>
  <text x="200" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TÉLÉPHONES</text>
</svg>

