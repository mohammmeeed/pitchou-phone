<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#38bdf8" opacity="0.14"/>
  <!-- Braided USB-C Cable loop -->
  <g transform="translate(110, 85)">
    <!-- Looped cable path -->
    <path d="M 30 140 C 30 30, 150 30, 150 140 C 150 210, 50 210, 50 140" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
    <!-- Type-C metal tip 1 -->
    <rect x="23" y="140" width="14" height="28" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="25" y="166" width="10" height="16" rx="2" fill="#94a3b8"/>
    <!-- Type-C metal tip 2 -->
    <rect x="43" y="140" width="14" height="28" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="45" y="166" width="10" height="16" rx="2" fill="#94a3b8"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">CÂBLES USB-C &amp; LIGHTNING</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">TRESSÉS, RAPIDES &amp; BLINDÉS</text>
</svg>
