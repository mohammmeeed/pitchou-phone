<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#f43f5e" opacity="0.1"/>
  <!-- iPhone Pro Style Phone -->
  <g transform="translate(142, 72)">
    <rect width="116" height="230" rx="26" fill="#09090b" stroke="url(#titanium)" stroke-width="3.5"/>
    <rect x="6" y="6" width="104" height="218" rx="21" fill="#000000"/>
    <!-- Dynamic Island -->
    <rect x="42" y="14" width="32" height="9" rx="4.5" fill="#18181b"/>
    <!-- Apple wallpaper aesthetic -->
    <ellipse cx="58" cy="120" rx="36" ry="50" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="48" cy="150" rx="40" ry="35" fill="#8b5cf6" opacity="0.5"/>
    <!-- Home Indicator -->
    <rect x="39" y="214" width="38" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">APPLE</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">IPHONE & IOS</text>
</svg>
