<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#10b981" opacity="0.12"/>
  <!-- Internal Battery Pack with flex cable -->
  <g transform="translate(135, 75)">
    <!-- Flex cable ribbon -->
    <path d="M 35 15 L 35 45" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <rect x="25" y="0" width="20" height="15" rx="3" fill="#d97706"/>
    <!-- Battery cell block -->
    <rect x="5" y="45" width="120" height="180" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
    <!-- Specs text simulation -->
    <rect x="20" y="65" width="90" height="12" rx="3" fill="#10b981" opacity="0.7"/>
    <rect x="20" y="85" width="65" height="8" rx="2" fill="#6b7280"/>
    <rect x="20" y="100" width="75" height="8" rx="2" fill="#6b7280"/>
    <rect x="20" y="115" width="55" height="8" rx="2" fill="#6b7280"/>
    <!-- Large mAh text -->
    <text x="65" y="170" font-family="monospace" font-size="20" font-weight="bold" fill="#34d399" text-anchor="middle">5000 mAh</text>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">BATTERIES INTERNES</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">REMPLACEMENT D'ORIGINE</text>
</svg>
