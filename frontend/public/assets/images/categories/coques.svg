<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="105" fill="#f43f5e" opacity="0.12"/>
  <!-- Phone Case -->
  <g transform="translate(145, 80)">
    <rect width="110" height="215" rx="24" fill="url(#caseGrad)" stroke="#fda4af" stroke-width="2"/>
    <!-- Camera Cutout -->
    <rect x="14" y="14" width="42" height="42" rx="14" fill="#09090b" opacity="0.85"/>
    <circle cx="27" cy="27" r="7" fill="#27272a"/>
    <circle cx="43" cy="41" r="7" fill="#27272a"/>
    <!-- MagSafe Ring -->
    <circle cx="55" cy="120" r="28" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" opacity="0.7"/>
    <line x1="55" y1="155" x2="55" y2="175" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">COQUES &amp; ÉTUIS</text>
  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fb7185" text-anchor="middle">SILICONE, CUIR &amp; ANTICHOC</text>
</svg>
