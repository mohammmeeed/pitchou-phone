  <text x="200" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ff6700" text-anchor="middle" letter-spacing="1">REDMI & POCO</text>
