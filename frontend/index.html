    <!-- Favicon dynamique synchronisé avec le logo du panneau d'administration -->
    <link rel="shortcut icon" type="image/png" href="/uploads/prod_img_1793699618_5e18935c.png" />
    <link rel="icon" type="image/png" href="/uploads/prod_img_1793699618_5e18935c.png" />
    <link rel="apple-touch-icon" href="/uploads/prod_img_1793699618_5e18935c.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shop_logo_image');
          if (saved && saved.trim()) {
            var links = document.querySelectorAll("link[rel*='icon'], link[rel='apple-touch-icon']");
            links.forEach(function(l) { l.href = saved.trim(); });
          }
        } catch (e) {}
      })();
    </script>
